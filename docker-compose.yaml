version: '3.8'

# Red compartida para la arquitectura de microservicios DigitalFix
networks:
  digitalfix-net:
    name: digitalfix-net
    external: true

services:
  ms-user:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-user-service
    ports:
      - "${PORT:-8082}:8082"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8082}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    volumes:
      # Montaje del Wallet mTLS de Oracle Cloud
      - ./wallet:/app/wallet:ro
    networks:
      - digitalfix-net
