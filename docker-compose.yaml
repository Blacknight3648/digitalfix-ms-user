version: '3.8'

services:
  # Base de Datos Oracle Local
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db-container
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${DB_PASSWORD:-oracle}
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - digitalfix-network
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Microservicio de Usuarios
  ms-digitalfix-user:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-digitalfix-user-container
    ports:
      - "${PORT:-8081}:8081"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      - DB_USERNAME=${DB_USERNAME:-SYSTEM}
      - DB_PASSWORD=${DB_PASSWORD:-oracle}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - digitalfix-network

networks:
  digitalfix-network:
    driver: bridge

volumes:
  oracle_data:
